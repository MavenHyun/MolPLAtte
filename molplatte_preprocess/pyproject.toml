[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "molplatte-prep"
version = "0.1.0"
description = "Corpus builder for MolPLAtte: FlavorDB / COCONUT -> anchored core + R-group records for MolPLA-style pretraining."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "MolPLAtte contributors" },
]
keywords = [
  "molpla",
  "molecular-representation",
  "pretraining",
  "flavor-chemistry",
  "natural-products",
  "rdkit",
  "torch-geometric",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: POSIX :: Linux",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  # Upper bound is deliberate, not cargo-culted.  Five of the eleven feature
  # tables in molplatte_prep/mol_features.py are built by enumerating an RDKit
  # enum at import time:
  #     chiral_tag   <- Chem.rdchem.ChiralType.names
  #     hybridization<- Chem.rdchem.HybridizationType.names
  #     bond_type    <- Chem.rdchem.BondType.names
  #     bond_dir     <- Chem.rdchem.BondDir.names
  #     bond_stereo  <- Chem.rdchem.BondStereo.names
  # Feature values are stored as the *index into that list*, and MASK_VALUES
  # reserves len(list) as the mask index.  If RDKit adds or reorders an enum
  # member in a future release, every index shifts and the embedding tables of a
  # model trained on an older corpus silently point at the wrong chemistry --
  # no exception, no warning, just degraded training.  Pin the ceiling and bump
  # it only after re-running the round-trip check in docs/corpus_format.md.
  # Built and measured against rdkit 2026.03.2.
  "rdkit>=2024.3.1,<2027",
  "torch",
  "torch-geometric",
  "networkx",
  "numpy",
  "pandas",
  "lmdb",
  "zstandard",
  # Required by --method macfrag: the vendored MacFrag implementation uses
  # igraph for its block-merging step and raises ImportError without it.
  "python-igraph>=0.10",
  "tqdm",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = [
  "molplatte_prep",
  "molplatte_prep.decomposers",
  "molplatte_prep.preprocess",
  "molplatte_prep.vendor",
  "molplatte_prep.vendor.synton",
  "molplatte_prep.vendor.synton.src",
]
package-dir = {"" = "src"}
py-modules = ["preprocess_flavor"]

[tool.setuptools.package-data]
"molplatte_prep.vendor.synton" = ["config/*.xml"]
