# @package _global_
#
# MolPallete + core decoration: the three MolPLA contrastive objectives plus
# recovery of the chemistry masking destroyed at each linker joint.
#
# Equivalent to `--config-name config assembly.enabled=true` with a wider set of
# recovered attributes than the minimal default.
#
#   python run.py --config-name config_assembly
defaults:
  - config
  - _self_

experiment_name: assembly_macfrag_v1

assembly:
  enabled:     true
  loss_weight: 0.5     # below 1.0 on purpose: MolPLA's stated limitation is
                       # "adversarial optimization trajectories incurred by three
                       # different loss objectives" -- a fourth at full weight is
                       # the obvious way to make that worse. Sweep this.
  head_kwargs:
    # Wider than the minimal set: hybridization and aromaticity matter for
    # whether the reformed bond is chemically sane.
    node_attrs: [atomic_num, formal_charge, num_explicit_hs, hybridization, is_aromatic]
    edge_attrs: [bond_type, edge_is_aromatic, is_conjugated, bond_stereo]
    fusion:     concat
    coupling:   false
