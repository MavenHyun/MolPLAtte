# MolPallete pretraining -- default composition.
#
# MolPLA's three contrastive objectives (graph / linker / R-group retrieval)
# over the anchored G / P / R / Q views, on MolDAM's engineering. See
# docs/molpallete_design.md for the notation contract; in particular the
# paper's `Q` is this code's `P`, and this code's `Q` is `P u R`.

defaults:
  - api: default
  - trainer: default
  - lightning: default
  - wandb: default
  - data_module: default
  - nnet_module: default
  - loss_module: default
  - _self_

experiment_name: under_development
random_seed: 911012
master_path: /home/mogan/
debug_mode: true
run_mode: train
checkpoint_mode: false

# Full-corpus R-group library retrieval (MolPLA's RGR evaluation).
# Requires a vocabulary built by molpallete_preprocess/enumerate_rgroups.py;
# the callback disables itself with a warning if none is found.
rgroup_library:
  enabled:            true
  vocab_path:         null   # defaults to <corpus>/rgroup_vocab.pkl.gz
  max_entries:        null   # null = the whole library; truncation inflates Hit@K
  every_n_epochs:     1
  enable_after_epoch: 2      # retrieval over random embeddings is noise
  search_k:           1000   # MolPLA retrieves the top 1000
  encode_batch_size:  1024
  max_queries:        20000  # exact search is n_queries x n_rows x dim; null = all.
                             # Truncation is seeded and logged, never silent.
