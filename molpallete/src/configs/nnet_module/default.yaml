# @package _global_

# Sub-block fields left `null` are inherit markers: the model fans the
# top-level `hidden_dim` / `dropout_rate` / `norm_method` down into any
# component that did not override them.

nnet_module: MolPallete
nnet_module_kwargs:
  hidden_dim:                300      # MolPLA's released width
  dropout_rate:              0.0
  norm_method:               GraphNorm
  gnn_conv:                  GINEConv
  num_conv:                  5
  graph_pooling:             mean
  condvec_dim:               97       # must match data_module_kwargs.condvec_dim

  # SimSiam-style stop-gradient toggles (MolPLA settings.yaml sg_P/sg_R/sg_Q).
  # All three losses are contrastive with no negative-free branch, so these are
  # MolPLA's only collapse mitigation. MolDAM has no equivalent -- do not drop
  # them.
  stop_gradient_P:           false
  stop_gradient_R:           false
  stop_gradient_Q:           true

  graph_encoder:             VanillaGNN
  graph_encoder_kwargs:
    hidden_dim:              null
    dropout_rate:            null
    norm_method:             null
  # pooled G / Q  ->  loss #1 (graph_contrastive)
  graph_projector:           MLPProjector
  graph_projector_kwargs:
    hidden_dim:              null
    dropout_rate:            null
    norm_method:             null
  # linker node embeddings in G vs P_lj + R_lj  ->  loss #2 (linker_contrastive)
  node_projector:            MLPProjector
  node_projector_kwargs:
    hidden_dim:              null
    dropout_rate:            null
    norm_method:             null
  # [P linker node emb || condvec]  ->  loss #3 query side
  query_projector:           MLPProjector
  query_projector_kwargs:
    hidden_dim:              null
    dropout_rate:            null
    norm_method:             null
  # pooled R  ->  loss #3 target side
  rgroup_projector:          MLPProjector
  rgroup_projector_kwargs:
    hidden_dim:              null
    dropout_rate:            null
    norm_method:             null

  # ---------------------------------------------------------------------------
  # Assembly head (core decoration).  OFF by default: `null` keeps the three
  # MolPLA objectives as the baseline.  Set to `AssemblyHead` to enable.
  #
  # What it does: retrieval says WHICH R-group belongs at a joint; the joint
  # itself is masked, so the shared linker atom's identity and the bond that
  # forms are unknown and the R-group cannot actually be attached.  This head
  # predicts them back.
  #
  # Requires `data_module_kwargs.need_assembly_targets: true` -- the targets are
  # derived at sampling time from the intact graph, so no corpus rebuild.
  # ---------------------------------------------------------------------------
  assembly_head:             null      # null | AssemblyHead
  assembly_head_kwargs:
    hidden_dim:              null
    dropout_rate:            null
    norm_method:             null
    # Which pre-mask attributes to recover. Defaults (null) are the minimal set
    # needed to attach an R-group: atom identity + bond type.
    #   node: atomic_num, formal_charge, chirality_specified, hybridization,
    #         num_explicit_hs, is_aromatic
    #   edge: bond_type, edge_is_aromatic, is_conjugated, bond_stereo
    # chiral_tag and bond_dir are deliberately unavailable -- the first is
    # order-dependent at a joint whose neighbour order changed by construction,
    # the second encodes how E/Z was WRITTEN. See data_modules/assembly_targets.py
    node_attrs:              null
    edge_attrs:              null
    # How to combine the joint's two masked views (P-side and R-side).
    #   concat -> learned projection over both (default)
    #   mean   -> MolDAM's 0.5*(core+rgroup); its own docs flag this as halving
    #             signal for asymmetric joints
    #   gate   -> learned per-dimension convex mix
    fusion:                  concat
    # Joint coupling InfoNCE. OFF: linker_contrastive already couples joints in
    # MolPLA's formulation. Enable only to ablate the two against each other.
    coupling:                false
