# @package _global_

# ``dataset_path: null`` is filled in by ``main.get_data_module`` as
# ``{master_path}/preprocessed/molpallete``; DataModuleConfig.__post_init__
# then appends ``{dataset_version}/{decomposition_method}``.

data_module: MolPalleteDataModule
data_module_kwargs:
  dataset_path:           null
  dataset_version:        coconut-flavordb-full
  # naveja_recap, rebuilt on the fragment tree. This comment previously argued
  # for macfrag because naveja_recap was measured at 99.42% single-R-group and
  # that was believed structural. It was an implementation artefact: the old
  # code took RECAP *children* as cores, and a child is one connected fragment,
  # so M - core is one pendant group at any ratio. Cutting every RECAP bond into
  # a flat partition and taking connected subtrees as cores fixes it, which is
  # the remedy MolDAM_prep/HANDOFF_PREPROCESSING.md sec.7 prescribes ("use a
  # multi-cut decomposer"). Measured at ratio 0.4, max_cores 4:
  #
  #             cores/mol   R/dec   k>=2   no_decomp
  #   before         8.36    1.11    9.5%       0.4%
  #   after          3.17    2.00   42.5%       1.3%
  #   MolPLA         3.15       -   52.7%          -
  #
  decomposition_method:   naveja_recap
  batch_size:             512
  # 32, measured. At batch 512 the GPU consumes 11,317 samples/s (fp32; bf16 is
  # faster still), while the loader sustains 8,455/s at 16 workers and 16,044/s
  # at 32 -- 16 leaves the GPU 25% starved, 32 gives 1.42x headroom. Each
  # __getitem__ does a torch.load + hydrate + detach, and decomposition-unit
  # sampling reloads a molecule's .pt once per core, so this is I/O-heavy.
  num_workers:            32
  val_split:              0.05
  test_split:             0.05
  seed:                   42
  persistent_workers:     true
  pin_memory:             true
  prefetch_factor:        2
  # Condition vector for MolPLA loss #3. `neutral` = ligand-only, 97 RDKit
  # fragment/SMARTS presence bits (see molpallete_prep/condvec.py). `pocket`
  # is a declared interface with a zero-filled implementation, which is
  # deliberately the paper's `Cond. None` ablation -- an unfed pocket run
  # shows up as collapsed retrieval rather than plausible noise.
  condvec_mode:           neutral
  condvec_dim:            0
  # Shuffle test: permute condition vectors across molecules. DIAGNOSTIC ONLY --
  # a run with this on is not a valid model. Read against the unshuffled arm:
  # unchanged retrieval means the condition is being ignored; a collapse means it
  # carries information the model cannot otherwise reach. For an R-group-derived
  # condvec that collapse would indicate LEAKAGE, which is how the original
  # 97-bit fragment vector should have been caught.
  shuffle_condvec:        false
  # Cap on detached R-groups per instance, i.e. rows contributed to the
  # per-linker retrieval loss.
  max_rgroups:            8
  # Derive pre-mask joint chemistry for the assembly head. Costs a little CPU
  # per __getitem__ and nothing on disk. Must be true when the head is enabled.
  need_assembly_targets:     false
  # MolPLA's augmentation is two-stage: one molecule yields many putative cores,
  # and one core yields the islinked subsets (detached R-groups are the targets,
  # the remaining ones stay attached to form the query template P).
  #
  #   decomposition  every (molecule, core) pair once per epoch -- 8.2x more
  #                  instances on the naveja corpus, and no longer under-samples
  #                  molecules that have many cores
  #   molecule       one core drawn per molecule per epoch (MolDAM's idiom)
  sampling_unit:             decomposition
  # MolPLA's common-R-group filter (paper section 2.1), instance-side: R-groups at
  # or above this percentile of the corpus occurrence distribution are "common",
  # and an instance whose DETACHED R-groups are more than max_common_fraction
  # common is redrawn. The library is deliberately NOT filtered -- shrinking the
  # retrieval space makes dropped queries unscoreable rather than harder and
  # inflates every metric computed against it.
  #
  # 99.99 is MolPLA's own value. It was unusable on the ratio-0.4 corpus, where
  # `*O` alone was 38% of occurrences and p99.99 kept only 12% of instances; that
  # corpus needed 99.999 as damage control. min_rgroup_atoms=2 removed the
  # single-atom R-groups that caused the skew, so the paper's threshold is
  # meaningful again. Measured over all 2^k-1 subsets on the v4 corpus:
  #
  #        p   common rows   occ.share   instances kept
  #    99.0            850       76.2%            20.7%
  #    99.9             85       53.8%            41.3%
  #    99.99             9       33.8%            60.2%
  #    99.999            1       10.6%            89.2%
  #
  # 60.2% retention against MolPLA's 85.6% -- this corpus is still the more
  # skewed of the two, but no longer pathologically so.
  common_percentile:         99.99
  max_common_fraction:       0.5
