# MolPLAtte pretraining -- default composition.
#
# MolPLA's three contrastive objectives (graph / linker / R-group retrieval)
# over the anchored G / P / R / Q views, on MolDAM's engineering. See
# docs/molplatte_design.md for the notation contract; in particular the
# paper's `Q` is this code's `P`, and this code's `Q` is `P u R`.

defaults:
  - api: default
  - trainer: default
  - lightning: default
  - wandb: default
  - data_module: default
  - nnet_module: default
  - loss_module: default
  - _self_

experiment_name: under_development
random_seed: 911012
master_path: /home/mogan/
debug_mode: true
run_mode: train
checkpoint_mode: false

# Full-corpus R-group library retrieval (MolPLA's RGR evaluation).
# Requires a vocabulary built by molplatte_preprocess/enumerate_rgroups.py;
# the callback disables itself with a warning if none is found.
rgroup_library:
  enabled:            true
  vocab_path:         null   # defaults to <corpus>/rgroup_vocab.pkl.gz
  max_entries:        null   # null = the whole library; truncation inflates Hit@K
  every_n_epochs:     1
  enable_after_epoch: 2      # retrieval over random embeddings is noise
  search_k:           1000   # MolPLA retrieves the top 1000
  encode_batch_size:  1024
  max_queries:        20000
  # Coefficient on log p(k) in the scoring-time popularity correction.
  # InfoNCE estimates PMI, not the posterior, so a PMI-trained model must have
  # log p added back before it is compared to a posterior-optimal frequency
  # prior. MolDAM measured the optimum at exactly 1.0 (devlog Phase 10).
  popularity_coef:    1.0  # exact search is n_queries x n_rows x dim; null = all.
                             # Truncation is seeded and logged, never silent.

# ---------------------------------------------------------------------------
# Assembly head (core decoration) -- ONE switch.
#
# Retrieval says WHICH R-group belongs at a joint; the joint is masked, so the
# shared linker atom's identity and the bond that forms are unknown and the
# R-group cannot actually be attached. This head predicts them back.
#
# `enabled` drives all three settings the head needs (nnet builds it, loss
# creates its term, dataset derives the targets). Setting those individually is
# a footgun -- a head without targets trains on nothing while logging a
# plausible loss -- so main._apply_assembly_switch propagates them together.
#
#   python run.py assembly.enabled=true
# ---------------------------------------------------------------------------
assembly:
  enabled:     false
  head:        AssemblyHead
  loss_weight: 0.5        # weight in the total loss alongside the three contrastive terms
  head_kwargs:
    node_attrs: null      # null = minimal set (atomic_num, formal_charge, num_explicit_hs)
    edge_attrs: null      # null = [bond_type]
    fusion:     concat    # concat | mean | gate
    coupling:   false     # linker_contrastive already couples joints
  loss_kwargs:
    recovery_weight: 1.0
    coupling_weight: 0.0
    temperature:     0.1

# Run outputs (.hydra/, run.log, prediction_tables/) land beside the checkpoints
# rather than in Hydra's default outputs/YYYY-MM-DD/HH-MM-SS under cwd, so a
# run's artefacts are all in one place and named after the experiment.
# Override with `hydra.run.dir=...` as usual.
hydra:
  run:
    dir: ${master_path}/checkpoints/molplatte/outputs/${experiment_name}
