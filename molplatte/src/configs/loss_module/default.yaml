# @package _global_

# All three are the same symmetric in-batch InfoNCE on L2-normalised views
# (MolPLA's `ContrastiveLoss(score_func='dualentropy')`, paper Eq. 13 "Dual
# InfoNCE"): 0.5*CE(XY^T/tau, I) + 0.5*CE(YX^T/tau, I).
#
# Temperatures below are MolPLA's RELEASED settings.yaml values. The paper
# reports 0.01 / 0.05 / 0.01 for graph / linker / rgroup respectively; the code
# ships 0.1 for the graph term. Following the code, since that is what produced
# the published numbers.

loss_module: LossModuleMolPLAtte
loss_module_kwargs:
  # #1  pooled G <-> pooled Q          (paper tau 0.01, code 0.1)
  loss_graph_kwargs:
    temperature:             0.1
  # #2  linker node emb in G <-> P_lj + R_lj   (paper 0.05, code 0.05)
  loss_linker_kwargs:
    temperature:             0.05
  # #3  [P linker emb || condvec] <-> pooled R (paper 0.01, code 0.01)
  loss_rgroup_kwargs:
    temperature:             0.01
    # Subtract log q(k) from the logits so the critic's optimum moves from PMI
    # (log p(k|q) - log p(k)) to the posterior log p(k|q), which is what r@k
    # rewards (Bengio & Senecal; Yi et al. 2019). Keeps inference as plain
    # cosine ANN with no re-ranking. main.py derives FAISSRetrieval's
    # popularity_correction from this flag so training and evaluation cannot
    # disagree about what the similarity means.
    # TRUE, on MolPLAtte's own measurement. This was FALSE, inherited from
    # MolDAM's devlog Phase 10, which measured a 14% loss (r@10 0.5792 vs
    # 0.6705) and concluded "Do not adopt logq_correction=True as-is". That
    # verdict does NOT transfer, and importing it untested cost ~3x retrieval
    # for every run before the sweep.
    #
    # Why it differs: the correction's value scales with how skewed the sampling
    # distribution is. MolDAM's anchored corpus has effective vocabulary 120;
    # MolPLAtte's is 889 over 86,385 rows. MolDAM's objection -- that q is
    # estimated from batch counts and floors at 1/batch_size, understating rare
    # chemistries -- is answered here by the running Laplace-smoothed estimator
    # in loss_modules/contrastive.py, which accumulates counts ACROSS batches
    # and only falls back to the batch-local floor for the first
    # logq_warmup_batches.
    #
    # Measured on coconut-flavordb_v6, held-out test split, hidden_dim 768:
    #
    #                        raw hit@1   corrected_hit@1   lift@1
    #   logq_correction=false   0.1187            0.3467     4.7x
    #   logq_correction=true    0.3726            0.3605    15.5x
    #
    # The gain is concentrated where the sampling bias was worst -- hit@1 on
    # R-groups occurring <=10 times went 0.2145 -> 0.8261, while the 10k+ head
    # barely moved (0.0350 -> 0.0418). That is the signature of removing a
    # frequency bias, not of exploiting one.
    #
    # NOTE the metric to read flips with this flag. With logQ off the critic
    # learns PMI and `corrected_hit@K` (scoring-time re-rank) is the honest
    # number; with logQ on the critic learns the posterior directly, so the
    # re-rank double-counts log p(k) and `corrected_hit@1` (0.3605) comes in
    # BELOW raw `hit@1` (0.3726). Read raw hit@K when this is true.
    logq_correction:         true
    # A single R-group hash can appear several times within one batch. Treat
    # every row sharing the target hash as a positive instead of scoring the
    # duplicates as negatives -- otherwise the loss is actively penalised for
    # being right.
    multi_positive:          true

  # Assembly loss. Omit (or leave null) to disable -- the loss term is only
  # created when this block is present, so a run without the head logs three
  # loss terms rather than a fourth that is silently zero.
  loss_assembly_kwargs:      null
  #  recovery_weight:  1.0   # mean over per-attribute CE, not sum: MolDAM's
  #                          # original sum let recovery outweigh coupling ~13x
  #  coupling_weight:  0.0   # only used if assembly_head_kwargs.coupling: true
  #  temperature:      0.1
